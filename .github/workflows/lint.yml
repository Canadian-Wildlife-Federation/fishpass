name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.8"
          args: "format --check"

      - name: Lint
        uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.8"
