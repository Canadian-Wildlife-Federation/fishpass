name: FishPass Azure Export

# Export (or re-export) the results of the last model run of a plan to Azure, without re-running
# the model. Everything comes from the plan's output schema (azure_exports + run_metadata tables);
# only the output schema name is read from the current config/models/<plan_code>.yaml.
on:
  workflow_dispatch:
    inputs:
      plan_code:
        description: "Plan code (loads config/models/<plan_code>.yaml)"
        required: true
      export_type:
        description: "Export type"
        type: choice
        options:
          - unversioned
          - versioned
        default: unversioned
      version:
        description: "Version label (required when versioned; max 16 characters: a-z A-Z 0-9 _ .)"
        required: false
        default: ""

# OIDC sign-in to Azure (see fishpass_engine/README.md -- Azure Export).
permissions:
  id-token: write
  contents: read

# A model run and an export-only run of the same plan must not overlap.
concurrency:
  group: fishpass-${{ inputs.plan_code }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    # The Azure federated credential trusts this environment.
    environment: azure-export
    env:
      PYTHONUNBUFFERED: "1"
      FISHPASS_HOST: ${{ secrets.FISHPASS_HOST }}
      FISHPASS_PORT: ${{ secrets.FISHPASS_PORT }}
      FISHPASS_DBNAME: ${{ secrets.FISHPASS_DBNAME }}
      FISHPASS_USER: ${{ secrets.FISHPASS_USER }}
      FISHPASS_PASSWORD: ${{ secrets.FISHPASS_PASSWORD }}
      AZURE_STORAGE_ACCOUNT_URL: ${{ secrets.AZURE_STORAGE_ACCOUNT_URL }}
      # Inputs are passed as environment variables, never pasted into the shell commands.
      PLAN_CODE: ${{ inputs.plan_code }}
      EXPORT_TYPE: ${{ inputs.export_type }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r fishpass_engine/scripts/requirements.txt
          sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Check export settings
        run: python fishpass_engine/scripts/azure_export.py "$PLAN_CODE" --export-type "$EXPORT_TYPE" --version "$VERSION" --check-only

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Export to Azure
        run: python fishpass_engine/scripts/azure_export.py "$PLAN_CODE" --export-type "$EXPORT_TYPE" --version "$VERSION"
