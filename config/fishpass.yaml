# Configuration for fishpass_engine.
# Edit natural_feature_types below to change the default natural/anthropogenic
# classification (or use a model plan's natural_feature_types_override field for a
# one-off, per-plan change -- see fishpass_engine/docs/inputs/model_plan_file.md).
#
# ANY feature_type NOT listed here -- including typos or future new feature types --
# falls back to 'anthropogenic'. This is a deliberate fail-safe default.
structure_classification:
  natural_feature_types:
    - waterfalls
    - gradients

# Database roles applied to the objects the WCRP scripts create (the <code>_wcrp schema,
# tracking table, ranked_barriers_* tables, and combined_output_table_vw).
#   owner        -- owns every object; scripts SET ROLE to it while creating them, so the
#                   connecting user must be (or be a granted member of) this role.
#   grant_all    -- roles granted ALL on each object.
#   grant_select -- roles granted SELECT only.
database_roles:
  owner: fishpass
  grant_all:
    - cwf_analyst
    - cwf_tech
  grant_select:
    - cwf_user

# WCRP tracking-table enum defaults. These values are synced into the support schema at the
# start of each model run so the database remains aligned with the YAML source of truth.
wcrp:
  tracking_table_enums:
    tt_structure_type:
      - 'Dam'
      - 'Stream crossing - OBS'
      - 'Stream crossing - CBS'
      - 'Stream crossing - Ford'
      - 'Other'
      - 'None'
    tt_structure_list_status_type:
      - 'Excluded structure'
      - 'Data-deficient barrier'
      - 'Non-actionable barrier'
      - 'Priority barrier'
      - 'Rehabilitated barrier'
    tt_passability_asmt_type:
      - 'Informal assessment'
      - 'Rapid assessment'
      - 'Full assessment'
    tt_assessment_step_type:
      - 'Informal assessment'
      - 'Passability assessment'
      - 'Habitat confirmation'
      - 'Detailed habitat investigation'
      - 'Engineering design'
      - 'Rehabilitated'
      - 'Post-rehabilitation monitoring'
      - 'Other'
    tt_excl_reason_type:
      - 'Passable'
      - 'No structure'
      - 'No key upstream habitat'
      - 'No structure and key upstream habitat'
    tt_excl_method_type:
      - 'Imagery review'
      - 'Informal assessment'
      - 'Field assessment'
      - 'Local knowledge'
    tt_partial_passability_type:
      - 'Yes'
      - 'No'
      - 'Unknown'
    tt_partial_passability_notes_type:
      - 'Proportion of individuals'
      - 'Proportion of time'
    tt_upstr_hab_quality_type:
      - 'High'
      - 'Medium'
      - 'Low'
      - 'N/A or unassessed'
    tt_constructability_type:
      - 'Difficult'
      - 'Moderate'
      - 'Easy'
    tt_priority_type:
      - 'High'
      - 'Medium'
      - 'Low'
    tt_rehab_type:
      - 'Removal/decommissioned'
      - 'Replacement - OBS'
      - 'Replacement - CBS'
      - 'Retrofit'
    tt_next_steps_type:
      - 'Barrier assessment'
      - 'Barrier reassessment'
      - 'In-depth passage assessment'
      - 'Habitat confirmation'
      - 'In-depth habitat investigation'
      - 'Identify barrier owner'
      - 'Engage with barrier owner'
      - 'Engage with partners'
      - 'Engage in public consultation'
      - 'Bring barrier to regulator'
      - 'Commission engineering designs'
      - 'Fundraise'
      - 'Rehabilitation'
      - 'Post-rehabilitation monitoring'
      - 'Correct deficiencies'
      - 'Leave until end of lifecycle'
      - 'Non-actionable'
      - 'N/A - project complete'
  # combined_output_table_vw flags label_in_wcrp_<sp>_<lc> = 'yes' when the barrier's
  # rank_combined is at or above (numerically <=) this rank.
  label_in_wcrp_rank_threshold: 30
  # Minimum weighted average gain per barrier (km). Groups below this are pushed to the
  # bottom of the immediate-gain ranking (rank_w_avg_gain_tiered).
  min_avg_gain_km: 0.5
